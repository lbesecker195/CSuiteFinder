# nginx site for CSuiteFinder.
#
#   sudo cp deploy/nginx-csuite-finder.conf /etc/nginx/sites-available/csuite-finder
#   sudo ln -s /etc/nginx/sites-available/csuite-finder /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Install this BEFORE running certbot. Certbot rewrites the file in place to
# add the TLS block and the port-80 redirect, so start with plain HTTP on 80.

upstream csuite_finder {
    server 127.0.0.1:4000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;   # <-- your domain

    # Certbot writes its challenge files here.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://csuite_finder;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # REQUIRED. The app runs with `force_ssl: [rewrite_on: [:x_forwarded_proto]]`,
        # so without this header it believes every request is plaintext and
        # redirects to HTTPS forever — an infinite loop that looks like the app
        # is broken when it is only mis-proxied.
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # PayPal retries webhooks; do not let a slow capture time out the delivery.
    location /csuitefinder/billing/webhook {
        proxy_pass http://csuite_finder;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    client_max_body_size 1m;
}
